# PHP SDK CI — the PHP analog of the other SDKs' dev gates (clippy / ruff / detekt / clang-tidy).
# Gates:
#   1. phpstan level 0  — the real-bug static-analysis gate (undefined methods/functions/vars, wrong arg counts).
#   2. phpunit and php self-test.php, each twice: KNISHIO_KCORE=require (the bundled libkcore must
#      load through ext-ffi and carry the run) and KNISHIO_KCORE=off (pure PHP + the persistent Node
#      ML-KEM helper). The live-server tests skip themselves when no validator URL is configured.
#   3. kcore-platforms — the bundled libkcore of every target, loaded and checked on its platform.
name: PHP

on: [push, pull_request]

jobs:
  # Catch version drift at commit time, not at release time. This matters more here than in
  # any other repo: Packagist publishes from the git tag and cannot be gated server-side, so
  # by the time a mismatched tag exists the bad version is already on its way out. Catching
  # composer.json drift on every push is the earliest signal available.
  version:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false (2026-08) — nothing here pushes; a kept token is readable from .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Declared versions agree
        run: bash .github/scripts/check-version.sh

  gate:
    name: phpstan + phpunit + self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.2 (the library's declared floor)
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2
        with:
          php-version: '8.2'
          extensions: sodium, json, mbstring, gmp, ffi
          tools: composer:v2
        env:
          # setup-php hits the GitHub API to fetch tools; the token avoids its own anon rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The SHA3 sponge is vendored in src/Libraries/Crypto/SHA3/ (no VCS dep, no
      # post-install hook) — plain Packagist resolution, no GitHub API auth needed.
      - name: composer install
        run: composer install --no-interaction --prefer-dist

      # Dependency audit gate: fail on known advisories in locked dependencies.
      - name: composer audit
        run: composer audit

      # The enforced dev gate: phpstan level 0 must be clean (0 errors).
      - name: phpstan (static-analysis gate)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Setup Node 20 (for the @noble/post-quantum ML-KEM bridge)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '20'

      - name: Install @noble/post-quantum (ML-KEM bridge dep)
        run: npm install

      # The bundled kcore/<target>/ libraries must be exactly the pinned KnishIO-Crypto-Core release files.
      - name: Bundled libkcore matches its pins
        run: bash scripts/fetch-kcore.sh --check

      - name: phpunit (libkcore required, then switched off)
        run: |
          KNISHIO_KCORE=require vendor/bin/phpunit
          KNISHIO_KCORE=off vendor/bin/phpunit

      # The parity gate: the frozen molecular-hash vectors + ML-KEM, on both backends.
      # Exit code = ($passedTests === $totalTests ? 0 : 1); cross-SDK validation is a
      # no-op here (single-repo checkout has no sibling SDK dumps) and never fails the run.
      - name: Self-test (libkcore required, then switched off)
        run: |
          KNISHIO_KCORE=require php self-test.php
          KNISHIO_KCORE=off php self-test.php

  kcore-platforms:
    name: kcore platforms
    uses: ./.github/workflows/kcore-platforms.yml

  # CycloneDX SBOM (Composer runtime tree + the npm ML-KEM bridge), scanned with OSV. One
  # definition (.github/scripts/sbom.sh) shared with audit.yml and publish.yml.
  sbom:
    name: SBOM (CycloneDX) + OSV scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.2 (the library's declared floor)
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2
        with:
          php-version: '8.2'
          extensions: sodium, json, mbstring
          tools: composer:v2
        env:
          # setup-php hits the GitHub API to fetch tools; the token avoids its own anon rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the SBOM generator (cyclonedx-php-composer 6.2.0, global plugin)
        run: |
          composer global config --no-interaction allow-plugins.cyclonedx/cyclonedx-php-composer true
          composer global require --no-interaction cyclonedx/cyclonedx-php-composer:6.2.0

      # composer.lock is gitignored. Resolve only — no download, no install, no package scripts.
      - name: Resolve dependencies to a lockfile (script-free, no install)
        run: composer update --no-install --no-scripts --no-plugins --no-interaction

      - name: Setup Node 20 (npm sbom over the committed ML-KEM bridge lock)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '20'

      - name: Generate SBOM
        run: bash .github/scripts/sbom.sh

      - name: Export SBOM paths
        run: cat sbom-out/paths.env >> "$GITHUB_ENV"

      - name: OSV scan (SBOM)
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36  # v2.7.0
        with:
          scan-args: |-
            -L
            ${{ env.SBOM_FILE }}

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: sbom-out/*.cdx.json
          if-no-files-found: error

  changelog:
    name: changelog entry for version bump
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the gate diffs against the base commit, which a shallow
      # checkout would not have.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # If composer.json's version changed relative to the base commit, CHANGELOG.md
      # must carry a matching `## [<version>]` heading. No version change → no-op.
      # Convention: docs/SDK-RELEASE-CONVENTIONS.md in the KnishIOClientSDK monorepo.
      - name: CHANGELOG entry for the manifest version bump
        # BASE arrives via env, never interpolated into the shell text (workflow-injection hygiene).
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          BASE="${BASE:-}"
          if [ -z "$BASE" ] || [ "$BASE" = '0000000000000000000000000000000000000000' ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No comparable base commit — changelog gate skipped."; exit 0
          fi
          ver() { sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$1" | head -1; }
          git show "$BASE:composer.json" > /tmp/base-manifest 2>/dev/null || : > /tmp/base-manifest
          NEW=$(ver composer.json); OLD=$(ver /tmp/base-manifest)
          if [ "$NEW" = "$OLD" ]; then echo "version unchanged ($NEW) — nothing to check."; exit 0; fi
          echo "version bumped: ${OLD:-<none>} -> $NEW"
          # index()==1 is a fixed-string match anchored at column 1: no regex escaping of the
          # version, and a deeper `### [x]` heading does NOT satisfy `## [x]` (grep -F would match it).
          if ! awk -v h="## [$NEW]" 'index($0, h) == 1 { f = 1 } END { exit !f }' CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Version bumped to $NEW but CHANGELOG.md has no '## [$NEW]' entry."
            exit 1
          fi
          echo "OK: CHANGELOG.md documents $NEW"
